name: Update Data & Deploy

on:
  schedule:
    # Run daily at 8 AM UTC (during NHL season)
    - cron: '0 8 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn requests

      - name: Generate data
        env:
          PUCKPEDIA_API_KEY: ${{ secrets.PUCKPEDIA_API_KEY }}
        run: python generate_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/comps.json
          git diff --staged --quiet || git commit -m "Auto-update contract comps data $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push

      # Mirror the refreshed data into the gated battanalytics-app embed
      # and regenerate its redacted public preview sample.
      - name: Sync to battanalytics-app
        env:
          BATTANALYTICS_PAT: ${{ secrets.BATTANALYTICS_PAT }}
        run: |
          git clone https://x-access-token:${BATTANALYTICS_PAT}@github.com/cbattinieri/battanalytics.git /tmp/battanalytics
          cp data/comps.json /tmp/battanalytics/app-embeds/nhl-contract-comps/data/comps.json
          python3 /tmp/battanalytics/scripts/sync_nhl_comps.py /tmp/battanalytics
          cd /tmp/battanalytics
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-embeds/nhl-contract-comps/data/comps.json public/apps/nhl-contract-comps/data/comps.json
          git diff --cached --quiet || git commit -m "chore: sync nhl-contract-comps data $(date -u '+%Y-%m-%d')"
          git push
